# 可选 overlay：把私有包 corehr-enterprise 装进 api 容器。
#
# Requirement: D-108 — Wave 2a 拆包：公开仓只留契约与 Demo 实现，
# 真正的引擎在私有包里。本 overlay 是**本地开发用**的可选层：
#
#   # 平台栈（base）
#   docker compose -f deploy/compose.yaml up -d
#   # 业务栈（产品实际用的组合：api 跑 hris.business_main:app）
#   docker compose -f deploy/compose.yaml -f deploy/compose.business.yaml up -d
#   # 装上私有包（可选）
#   docker compose -f deploy/compose.yaml -f deploy/compose.business.yaml \
#     -f deploy/compose.enterprise.yaml up -d
#
# 要点：
# 1. base `deploy/compose.yaml` **完全不改**：只 clone 公开仓也能
#    `docker compose up` 正常起（此时流程写接口返回 LICENSE_REQUIRED）。
# 2. api 镜像的 build context 是 `apps/api`，`packages/` **天然不进镜像**，
#    因此本 overlay 用 bind mount 而不是改 build context。
# 3. 挂载点用 `:ro`：容器只读私有包源码，不允许容器内改写。
# 4. PYTHONPATH 追加私有包的 `src`，让 `corehr_enterprise` 可导入；
#    公开仓的 `resolve_engine()` 工厂按包是否可导入来切换实现。

services:
  api:
    volumes:
      - ../packages/corehr-enterprise:/opt/corehr-enterprise:ro
    environment:
      PYTHONPATH: /app/src:/opt/corehr-enterprise/src
